name: Bug report
description: Report reproducible incorrect behavior. Do not report vulnerabilities publicly.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Security vulnerabilities must use the private reporting channel once published."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Remove credentials, prompts, responses, and customer data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and relevant configuration
    validations:
      required: true
