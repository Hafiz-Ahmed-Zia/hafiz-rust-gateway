name: Feature or research proposal
description: Propose a validated problem, not only a feature.
title: "proposal: "
labels: ["proposal", "needs-evidence"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and affected user
      description: Describe a concrete workflow or incident.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence, frequency, and impact
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current alternatives and why they are insufficient
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired measurable outcome
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security, privacy, compatibility, and operational risks
