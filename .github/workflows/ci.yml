name: CI

on:
  pull_request:
  push:
    branches: [main, development, staging, production]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install declared Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Install pinned RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Cargo.lock
        run: cargo audit --deny warnings

      - name: Install pinned dependency policy tool
        run: cargo install cargo-deny --version 0.19.4 --locked

      - name: Check dependency licenses, bans, and sources
        run: cargo deny check licenses bans sources
