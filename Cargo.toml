[workspace]
members = [
    "crates/gateway-bin",
    "crates/gateway-core",
    "crates/gateway-testkit",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
authors = ["Hafiz Rust Gateway contributors"]
license = "Apache-2.0"
repository = "https://github.com/Hafiz-Ahmed-Zia/hafiz-rust-gateway"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
